{% extends "base.html" %}

{% block title %}CliqSlip - Clinic Setup{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #f1f5f9, #e2e8f0); font-family: sans-serif; padding: 20px;">
    
    <div style="background: white; padding: 40px; border-radius: 16px; border: 1px solid #cbd5e1; width: 100%; max-width: 500px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);">
        
        <!-- Header -->
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="font-size: 40px; margin-bottom: 10px;">🏥</div>
            <h2 style="margin: 0 0 5px 0; color: #0f172a; font-size: 24px; font-weight: 700;">Clinic Setup</h2>
            <p style="margin: 0; color: #64748b; font-size: 14px;">Fill in your professional clinic details to get started.</p>
        </div>

        <!-- Form -->
        <form action="/setup-clinic" method="POST">
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 13.5px; font-weight: 600; color: #475569; margin-bottom: 8px;">Full Name (Dr.)</label>
                <input type="text" name="doctor_name" required placeholder="e.g. Sehram Khalid Memon" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14.5px; outline: none; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 13.5px; font-weight: 600; color: #475569; margin-bottom: 8px;">Clinic / Hospital Name</label>
                <input type="text" name="clinic_name" required placeholder="e.g. City Health Clinic" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14.5px; outline: none; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 13.5px; font-weight: 600; color: #475569; margin-bottom: 8px;">Consultation Fee (PKR)</label>
                <input type="number" name="consultation_fee" required placeholder="e.g. 1000" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14.5px; outline: none; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 30px;">
                <label style="display: block; font-size: 13.5px; font-weight: 600; color: #475569; margin-bottom: 8px;">Specialization</label>
                <input type="text" name="specialization" required placeholder="e.g. Health Informatics & General Medicine" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14.5px; outline: none; box-sizing: border-box;">
            </div>

            <button type="submit" style="width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);">
                Save & Open Dashboard 🚀
            </button>
        </form>

    </div>
</div>
{% endblock %}
