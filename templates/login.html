{% extends "base.html" %}

{% block title %}CliqSlip - Secure Login{% endblock %}

{% block content %}
<div class="split-login-container">
    <!-- Left Side: Login Form Box -->
    <div class="login-left-side">
        <div class="login-form-box">
            
            <div class="brand-title-area">
                <h1 class="company-name">Welcome Back</h1>
                <p class="company-tagline">Please sign in to access your clinic panel</p>
            </div>

            <form action="/login" method="POST">
                <div class="input-group">
                    <label for="email">Doctor Email</label>
                    <input type="email" id="email" name="email" required placeholder="doctor@clinic.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                
                <!-- Forgot Password Link -->
                <div class="forgot-password-container">
                    <a href="/forgot-password" class="auth-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login">Login to Dashboard</button>
            </form>

            <!-- Create New Account Option -->
            <div class="signup-prompt">
                <p>Don't have an account? <a href="/signup" class="auth-link">Create New Account</a></p>
            </div>
        </div>
    </div>

    <!-- Right Side: Clean Auto-Scaling Image Frame (Red Box Removed) -->
    <div class="login-right-side">
        <div class="image-frame-card">
            <img src="{{ url_for('static', filename='login_bg.png') }}" alt="Clinic Background" class="right-bg-img">
        </div>
    </div>
</div>
{% endblock %}
