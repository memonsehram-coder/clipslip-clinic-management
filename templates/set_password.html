{% extends "base.html" %}

{% block title %}CliqSlip - Set Password{% endblock %}

{% block content %}
<div class="split-login-container">
    <div class="login-left-side">
        <div class="login-form-box">
            <div class="brand-title-area">
                <h1 class="company-name">Create Password</h1>
                <p class="company-tagline">Set a secure password for your account</p>
            </div>

            <form action="/set-password" method="POST">
                <div class="input-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <div class="input-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-login" style="margin-top: 10px;">Save Password & Continue</button>
            </form>
        </div>
    </div>

    <div class="login-right-side">
        <div class="image-frame-card">
            <img src="{{ url_for('static', filename='login_bg.png') }}" alt="Clinic Background" class="right-bg-img">
        </div>
    </div>
</div>
{% endblock %}
