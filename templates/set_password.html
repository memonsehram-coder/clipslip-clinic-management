{% extends "base.html" %}

{% block title %}CliqSlip - Set Password{% endblock %}

{% block content %}
<div class="split-login-container">
    <div class="login-left-side">
        <div class="login-form-box">
            <div class="brand-title-area">
                <h1 class="company-name">Create Password</h1>
                <p class="company-tagline">Set a secure password for your account</p>
            </div>

            <form action="/set-password" method="POST">
                <div style="margin-bottom: 15px;">
                    <label for="password" style="display: block; margin-bottom: 5px; font-weight: bold; color: #1e293b; font-size: 14px;">New Password</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="password" name="password" required placeholder="••••••••" style="width: 100%; padding: 12px 40px 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
                        <button type="button" onclick="togglePassword('password', 'eye-icon-1')" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; font-size: 16px;" title="Show/Hide Password">
                            <span id="eye-icon-1">👁️</span>
                        </button>
                    </div>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label for="confirm_password" style="display: block; margin-bottom: 5px; font-weight: bold; color: #1e293b; font-size: 14px;">Confirm Password</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••" style="width: 100%; padding: 12px 40px 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
                        <button type="button" onclick="togglePassword('confirm_password', 'eye-icon-2')" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; font-size: 16px;" title="Show/Hide Password">
                            <span id="eye-icon-2">👁️</span>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login" style="margin-top: 10px; width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Save Password & Continue</button>
            </form>
        </div>
    </div>

    <div class="login-right-side">
        <div class="image-frame-card">
            <img src="{{ url_for('static', filename='login_bg.png') }}" alt="Clinic Background" class="right-bg-img">
        </div>
    </div>
</div>

<script>
    function togglePassword(fieldId, iconId) {
        const passwordField = document.getElementById(fieldId);
        const eyeIcon = document.getElementById(iconId);
        
        if (passwordField.type === "password") {
            passwordField.type = "text";
            eyeIcon.textContent = "🙈";
        } else {
            passwordField.type = "password";
            eyeIcon.textContent = "👁️";
        }
    }
</script>
{% endblock %}
