{% extends "base.html" %}

{% block title %}CliqSlip - Create Account{% endblock %}

{% block content %}
<div class="split-login-container">
    <div class="login-left-side">
        <div class="login-form-box">
            <div class="brand-title-area">
                <h1 class="company-name">Create Account</h1>
                <p class="company-tagline">Enter your email to receive verification OTP</p>
            </div>

            <!-- Error Message Alert Box -->
            {% if error %}
            <div style="background-color: #ffeeee; color: #d9534f; padding: 10px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #f5c6cb; font-size: 13px; text-align: center; font-weight: 500;">
                {{ error }}
            </div>
            {% endif %}

            <!-- Google Connect Button -->
            <div style="margin-bottom: 20px;">
                <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; color: #333; text-decoration: none; font-weight: 500; font-size: 14px; box-sizing: border-box;">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo" style="width: 18px; height: 18px;">
                    Continue with Google
                </a>
            </div>

            <div style="text-align: center; margin-bottom: 15px; color: #64748b; font-size: 13px; font-weight: 600;">OR SIGN UP WITH EMAIL</div>

            <!-- Direct Signup Form -->
            <form action="/signup" method="POST">
                <div class="input-group">
                    <label for="email">Your Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="doctor@gmail.com">
                </div>
                <button type="submit" class="btn-login" style="margin-top: 10px; width: 100%;">Send Verification OTP 🚀</button>
            </form>

            <div class="signup-prompt" style="margin-top: 20px;">
                <p>Already have an account? <a href="/login" class="auth-link">Sign In</a></p>
            </div>
        </div>
    </div>

    <div class="login-right-side">
        <div class="image-frame-card">
            <img src="{{ url_for('static', filename='login_bg.png') }}" alt="Clinic Background" class="right-bg-img">
        </div>
    </div>
</div>
{% endblock %}
